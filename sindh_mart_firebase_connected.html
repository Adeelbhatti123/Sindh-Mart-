<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sindh Mart — Sukkur & Rohri</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f5;color:#202820}
header{background:#0b6b3a;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.logo{font-size:24px;font-weight:800}.tag{font-size:12px;opacity:.9}
.search{flex:1;max-width:500px;margin-left:auto;padding:11px 14px;border:0;border-radius:24px;font-size:15px}
.cart{background:#d7a62a;color:#111;border:0;border-radius:22px;padding:10px 14px;font-weight:700}
main{max-width:1100px;margin:auto;padding:18px 14px}.hero{background:linear-gradient(135deg,#0b6b3a,#14965a);color:#fff;border-radius:18px;padding:28px 22px;margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0}.cats{display:flex;gap:9px;overflow:auto;padding:4px 0 14px}.cat{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:20px;padding:9px 14px;cursor:pointer}.cat.active{background:#0b6b3a;color:#fff}
h2{margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px #0000000d}.pic{height:120px;border-radius:10px;background:#eef4ef;display:flex;align-items:center;justify-content:center;font-size:44px}.name{font-weight:700;margin:10px 0 5px;min-height:38px}.price{font-size:18px;font-weight:800;color:#0b6b3a}.old{text-decoration:line-through;color:#888;font-size:12px;margin-left:5px}.add{width:100%;margin-top:9px;padding:10px;border:0;border-radius:9px;background:#0b6b3a;color:#fff;font-weight:700;cursor:pointer}
.empty{background:#fff;border-radius:14px;padding:25px;text-align:center;color:#777}.status{font-size:12px;margin:8px 0;color:#555}
footer{margin-top:30px;background:#143b29;color:#fff;padding:25px 15px;text-align:center}
@media(max-width:700px){.top{flex-wrap:wrap}.logo{width:100%}.search{order:3;max-width:none;width:100%;margin:0}.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:25px}}
</style>
</head>
<body>
<header><div class="top">
<div><div class="logo">Sindh Mart</div><div class="tag">Har Ghar Ki Zaroorat, Ab Online</div></div>
<input id="search" class="search" placeholder="Search products...">
<button class="cart" onclick="showCart()">🛒 Cart (<span id="count">0</span>)</button>
</div></header>

<main>
<section class="hero"><h1>Sukkur & Rohri Ki Online Mart</h1><p>Grocery aur daily-use products ghar tak — Cash on Delivery.</p></section>
<div id="status" class="status">Firebase se products load ho rahe hain...</div>
<div id="cats" class="cats"></div>
<h2>Products</h2>
<div id="products" class="grid"></div>
</main>
<footer>Sindh Mart • Sukkur & Rohri • Cash on Delivery</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2J8uu4ZNIp0ubB9Opp1Uin8HnJzsa1cs",
  authDomain: "sindh-mart.firebaseapp.com",
  databaseURL: "https://sindh-mart-default-rtdb.firebaseio.com",
  projectId: "sindh-mart",
  storageBucket: "sindh-mart.firebasestorage.app",
  messagingSenderId: "362306587082",
  appId: "1:362306587082:web:e32acf1002ab36a1106733",
  measurementId: "G-TTRXHPP213"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
let products={}, categories={}, selected="all", cart=JSON.parse(localStorage.getItem("sindhCart")||"[]");

const icons=["🛒","🥤","🍟","🍪","🍫","🍳","🧴","🧹","🍼"];

function renderCats(){
 const el=document.getElementById("cats");
 el.innerHTML='<button class="cat '+(selected==="all"?"active":"")+'" onclick="selectCat(\'all\')">All</button>';
 Object.entries(categories).forEach(([id,c],i)=>{
   if(c.active!==false) el.innerHTML+=`<button class="cat ${selected===id?"active":""}" onclick="selectCat('${id}')">${icons[i%icons.length]} ${esc(c.name)}</button>`;
 });
}
window.selectCat=id=>{selected=id;renderCats();renderProducts()};
function renderProducts(){
 const q=document.getElementById("search").value.toLowerCase();
 const el=document.getElementById("products"); el.innerHTML="";
 Object.entries(products).forEach(([id,p])=>{
   if(p.active===false || (selected!=="all"&&p.categoryId!==selected) || !String(p.name||"").toLowerCase().includes(q)) return;
   el.innerHTML+=`<article class="card">
     <div class="pic">🛍️</div>
     <div class="name">${esc(p.name||"Product")}</div>
     <div><span class="price">Rs. ${Number(p.price||0).toLocaleString()}</span>${Number(p.oldPrice)>0?`<span class="old">Rs. ${Number(p.oldPrice).toLocaleString()}</span>`:""}</div>
     <div class="status">Stock: ${Number(p.stock||0)}</div>
     <button class="add" onclick="addCart('${id}')">Add to Cart</button>
   </article>`;
 });
 if(!el.innerHTML)el.innerHTML='<div class="empty">No products found.</div>';
}
window.addCart=id=>{cart.push(id);localStorage.setItem("sindhCart",JSON.stringify(cart));updateCount();alert("Product cart mein add ho gaya.");};
function updateCount(){document.getElementById("count").textContent=cart.length}
window.showCart=()=>alert("Cart items: "+cart.length+"\\nCheckout feature next step mein connect karenge.");
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
document.getElementById("search").addEventListener("input",renderProducts);

onValue(ref(db,"categories"),s=>{categories=s.val()||{};renderCats();renderProducts();});
onValue(ref(db,"products"),s=>{products=s.val()||{};document.getElementById("status").textContent="✓ Firebase connected — products live database se load ho rahe hain.";renderProducts();});
updateCount();
</script>
</body>
</html>
